<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Course • Sayeed Courses</title>
  <link rel="icon" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="course-page">
  <header class="topbar sticky">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><img src="assets/images/logo.png" alt="Sayeed Courses"><div><div class="brand-title">SAYEED</div><div class="brand-subtitle">COURSES</div></div></a>
      <a class="back-link" href="index.html">← Courses</a>
    </div>
  </header>

  <main class="container course-shell">
    <section id="courseHero" class="course-hero-card"></section>
    <div class="course-layout">
      <section class="lesson-panel">
        <div class="panel-head"><div><span class="eyebrow">COURSE CONTENT</span><h2>Chapters & lessons</h2></div><span id="lessonCount" class="count-pill"></span></div>
        <div id="chapterList" class="chapter-list"></div>
      </section>
      <aside class="player-panel" id="playerPanel">
        <div class="player-sticky">
          <div id="playerShell" class="player-shell">
            <div class="player-placeholder"><div class="loader"></div><p>Choose a lesson to start watching.</p></div>
          </div>
          <div id="nowPlaying" class="now-playing hidden"></div>
        </div>
      </aside>
    </div>
  </main>

  <footer class="footer container"><div>© <span id="year"></span> Sayeed Courses</div><div class="footer-love">Made With ❤️ By Shahid Sir</div></footer>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="assets/js/course.js"></script>
</body>
</html>
