<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07111f" />
  <link rel="icon" href="assets/img/logo.png" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <title>Course — Sayeed Courses</title>
</head>
<body>
  <div class="site-shell">
    <header class="topbar glass">
      <a class="brand" href="index.html">
        <img src="assets/img/logo.png" alt="Sayeed Courses logo" class="brand-logo" />
        <div>
          <div class="brand-name">SAYEED COURSES</div>
          <div class="brand-sub">Learning portal</div>
        </div>
      </a>
      <div class="top-actions"><a class="ghost-btn" href="index.html">Courses</a></div>
    </header>

    <main>
      <section class="course-hero glass-card" id="courseHero"></section>

      <div class="course-layout">
        <aside class="module-panel glass-card">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">COURSE CONTENT</span>
              <h2>Modules</h2>
            </div>
            <span id="moduleCount" class="mini-count">0</span>
          </div>
          <div id="moduleList" class="module-list"></div>
        </aside>

        <section class="lesson-stage">
          <div class="player-card glass-card">
            <div class="player-wrap" id="playerWrap">
              <div class="player-placeholder">
                <div class="player-play">▶</div>
                <h3>Select a module</h3>
                <p>Your lesson will play inside the application.</p>
              </div>
            </div>
          </div>
          <div class="lesson-info glass-card" id="lessonInfo">
            <span class="eyebrow">NOW PLAYING</span>
            <h2>Select a module to begin</h2>
            <p>Choose a module from the left to start learning.</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer">Made With <span>♥</span> By Shahid Sir</footer>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/course.js"></script>
</body>
</html>
